<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>做题模式 · 实验安全题库</title>
<style>
:root{color-scheme:light;--blue:#175b9a;--ink:#17324d;--edge:#dae3ee}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.wrap{max-width:780px;margin:auto;padding:18px 14px 60px}a{color:var(--blue)}header{background:linear-gradient(120deg,#143b61,#286eaa);color:#fff;border-radius:18px;padding:22px;margin:14px 0}h1{font-size:25px;margin:0 0 8px}header p{font-size:14px;margin:0;color:#d6e8fa}.panel,.card{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:20px;margin:14px 0}.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{font-size:14px}select{display:block;margin-top:5px;border:1px solid #bbcddd;border-radius:9px;background:white;padding:9px;font:inherit;color:var(--ink)}button{font:inherit;cursor:pointer;border:1px solid #bdcedf;border-radius:10px;background:white;color:var(--blue);padding:9px 16px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}.note{font-size:13px;color:#687c8e;margin:12px 0 0}.meta{font-size:13px;color:#687c8e}h2{font-size:18px;line-height:1.8;margin:12px 0 17px;white-space:pre-wrap;overflow-wrap:anywhere}.choices{display:grid;gap:10px}.option{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px;color:var(--ink);background:#fafcff;line-height:1.65;overflow-wrap:anywhere}.option input{margin-top:6px;accent-color:var(--blue);width:17px;height:17px;flex-shrink:0}.option.selected{background:#edf5fd;border-color:var(--blue)}.option.right{background:#eaf8f0;border-color:#8bd0a1;color:#155b39}.option.wrong{background:#fff0ef;border-color:#e79991;color:#a13c30}.option:disabled{opacity:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{padding:14px;border-radius:12px;background:#eaf8f0;color:#155b39;margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere}.feedback.bad{background:#fff0ef;color:#a13c30}.analysis{font-size:14px;background:#f2f6fb;padding:14px;border-radius:12px;white-space:pre-wrap;margin-top:12px;overflow-wrap:anywhere}.summary{text-align:center;padding:28px 10px}.summary strong{font-size:35px;display:block;color:var(--blue)}progress{width:100%;height:9px;accent-color:var(--blue)}[hidden]{display:none!important}.status{font-size:14px;color:#687c8e;margin:10px 0}@media(max-width:500px){.wrap{padding:10px}.card,.panel{padding:16px}h1{font-size:22px}h2{font-size:17px}.settings{gap:10px}}
</style></head><body><div class="wrap"><a href="./index.html">← 返回学习模式</a><header><h1>实验安全题库 · 做题模式</h1><p>先独立作答，提交后查看答案和原题解析。</p></header>
<section class="panel"><div class="settings"><label>题型<select id="type"><option>全部</option><option>单选题</option><option>多选题</option><option>判断题</option></select></label><label>练习方式<select id="mode"><option>顺序</option><option>随机</option><option>错题</option></select></label><button id="start" class="primary">开始练习</button></div><p class="note">13 道原题缺少 E/F 选项，暂不参与做题；可在学习模式查看。错题保存在当前浏览器，答对后自动移出错题本。</p><p id="saved" class="status"></p></section>
<div id="practice" hidden><p id="stats" class="status" aria-live="polite"></p><progress id="progress" value="0" max="1" aria-label="练习进度"></progress><main id="question" class="card"></main></div><p id="message" class="status" role="status">选择题型和练习方式，点击“开始练习”。</p>
</div><script src="questions.js"></script><script src="quiz-core.js"></script><script src="practice.js"></script></body></html>
